<section class="workspace"><header class="topbar"><div><p class="eyebrow">Personal training</p><h1>Find a Trainer</h1><p class="page-copy">Find a personal trainer when you want one. MacroSync remains fully usable without a trainer.</p></div></header>
<section class="panel trainer-search-panel"><div class="trainer-search-grid"><div class="field"><label for="trainerSearch">Search</label><input id="trainerSearch" maxlength="80" placeholder="Name, business, or location" /></div><div class="field"><label for="trainerType">Training type</label><select id="trainerType"><option value="">Any training type</option><option value="1">General Fitness</option><option value="2">Strength Training</option><option value="3">Weight Training</option><option value="4">Conditioning</option><option value="5">Sports Performance</option><option value="6">Mobility / Flexibility</option><option value="7">Functional Training</option><option value="8">Group Training</option><option value="9">Beginner Training</option><option value="10">Youth Training</option><option value="11">Senior Fitness</option><option value="12">Nutrition / Meal Planning</option><option value="13">Other</option></select></div><div class="field"><label for="trainerPrice">Price range</label><select id="trainerPrice"><option value="">Any price</option><option value="1">Under $25/session</option><option value="2">$25–$49/session</option><option value="3">$50–$74/session</option><option value="4">$75–$99/session</option><option value="5">$100+/session</option><option value="6">Contact trainer</option></select></div><div class="trainer-search-actions"><button class="primary-button" id="trainerSearchButton" type="button">Search</button></div></div></section>
<section class="panel"><div class="panel-header"><div><p class="eyebrow">Directory</p><h2>Available trainers</h2></div></div><div class="trainer-list" id="trainerList"><p class="page-copy">Loading trainers…</p></div></section></section>
